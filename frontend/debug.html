<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Base Jump Debug</title>
  <style>
    body {
      background: #1a1a1a;
      color: #00ff00;
      font-family: monospace;
      padding: 20px;
      margin: 0;
    }
    .log {
      background: #000;
      border: 1px solid #00ff00;
      padding: 10px;
      margin: 10px 0;
      border-radius: 4px;
      max-height: 400px;
      overflow-y: auto;
      font-size: 12px;
    }
    button {
      padding: 10px 20px;
      margin: 5px;
      background: #00ff00;
      color: #000;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      background: #00dd00;
    }
    .success { color: #00ff00; }
    .error { color: #ff0000; }
    .info { color: #00aaff; }
  </style>
</head>
<body>

<h1>🐛 Base Jump Debug Console</h1>

<div>
  <button onclick="checkEthers()">Check ethers.js</button>
  <button onclick="checkMetaMask()">Check MetaMask</button>
  <button onclick="connectTest()">Test Connect Wallet</button>
  <button onclick="clearLog()">Clear Log</button>
</div>

<div id="log" class="log">Waiting for tests...\n</div>

<script src="https://cdn.jsdelivr.net/npm/ethers@6/dist/ethers.umd.js"></script>

<script>
const logEl = document.getElementById('log');

function log(message, type = 'info') {
  const line = `[${new Date().toLocaleTimeString()}] <span class="${type}">${message}</span>`;
  logEl.innerHTML += line + '\n';
  logEl.scrollTop = logEl.scrollHeight;
  console.log(message);
}

function clearLog() {
  logEl.innerHTML = '';
}

function checkEthers() {
  log('=== Checking ethers.js ===', 'info');
  
  if (typeof ethers !== 'undefined') {
    log(`✅ ethers.js loaded: v${ethers.version}`, 'success');
    log(`├─ ethers.BrowserProvider available: ${typeof ethers.BrowserProvider !== 'undefined'}`, 'success');
    log(`├─ ethers.Contract available: ${typeof ethers.Contract !== 'undefined'}`, 'success');
    log(`└─ ethers.JsonRpcProvider available: ${typeof ethers.JsonRpcProvider !== 'undefined'}`, 'success');
  } else {
    log('❌ ethers.js NOT loaded', 'error');
  }
}

function checkMetaMask() {
  log('=== Checking MetaMask ===', 'info');
  
  if (window.ethereum) {
    log(`✅ window.ethereum available`, 'success');
    log(`├─ isMetaMask: ${window.ethereum.isMetaMask}`, 'success');
    log(`├─ isCoinbaseWallet: ${window.ethereum.isCoinbaseWallet}`, 'success');
    log(`└─ selectedAddress: ${window.ethereum.selectedAddress || 'not connected'}`, 'info');
  } else {
    log('❌ window.ethereum NOT available (MetaMask not installed?)', 'error');
  }
}

async function connectTest() {
  log('=== Testing Wallet Connection ===', 'info');
  
  // Check dependencies
  if (typeof ethers === 'undefined') {
    log('❌ ethers.js not loaded', 'error');
    return;
  }
  
  if (!window.ethereum) {
    log('❌ MetaMask not available', 'error');
    return;
  }
  
  try {
    log('Requesting accounts from MetaMask...', 'info');
    const accounts = await window.ethereum.request({
      method: 'eth_requestAccounts'
    });
    
    log(`✅ Got ${accounts.length} account(s)`, 'success');
    log(`├─ Primary: ${accounts[0]}`, 'success');
    
    // Check network
    const chainId = await window.ethereum.request({
      method: 'eth_chainId'
    });
    log(`✅ Current chain: ${chainId} (${parseInt(chainId, 16)})`, 'success');
    
    // Try creating BrowserProvider (ethers v6)
    const provider = new ethers.BrowserProvider(window.ethereum);
    log(`✅ BrowserProvider created`, 'success');
    
    // Try getting signer
    const signer = await provider.getSigner();
    log(`✅ Signer obtained`, 'success');
    
    const signerAddress = await signer.getAddress();
    log(`✅ Signer address: ${signerAddress}`, 'success');
    
    log('=== ALL TESTS PASSED ===', 'success');
  } catch (error) {
    log(`❌ Error: ${error.message}`, 'error');
    log(`Stack: ${error.stack}`, 'error');
  }
}

// Auto-run checks on load
window.addEventListener('load', () => {
  log('Page loaded, running auto-checks...', 'info');
  setTimeout(checkEthers, 100);
  setTimeout(checkMetaMask, 200);
});
</script>

</body>
</html>
