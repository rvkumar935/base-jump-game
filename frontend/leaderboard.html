<!DOCTYPE html>
<html>
<head>
  <title>Base Jump Game - Leaderboard</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .leaderboard-container {
      max-width: 800px;
      margin: 20px auto;
      background: #1a1a1a;
      border-radius: 8px;
      padding: 20px;
    }

    .leaderboard-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    .leaderboard-table th {
      background: #2a2a2a;
      padding: 12px;
      text-align: left;
      border-bottom: 2px solid #00ff00;
      font-weight: bold;
    }

    .leaderboard-table td {
      padding: 12px;
      border-bottom: 1px solid #333;
    }

    .leaderboard-table tr:hover {
      background: #2a2a2a;
    }

    .rank {
      font-weight: bold;
      color: #ffd700;
    }

    .rank.top {
      color: #00ff00;
    }

    .address {
      font-family: monospace;
      font-size: 12px;
    }

    .player-stats {
      background: #2a2a2a;
      padding: 15px;
      border-radius: 4px;
      margin: 20px 0;
    }

    .stat-item {
      display: inline-block;
      margin-right: 20px;
    }

    .stat-label {
      color: #888;
      font-size: 12px;
    }

    .stat-value {
      color: #00ff00;
      font-weight: bold;
      font-size: 18px;
    }

    .button-group {
      margin: 20px 0;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      padding: 10px 20px;
      background: #0a6e0a;
      color: white;
      border: 1px solid #00ff00;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #0a9e0a;
    }

    #global-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
      margin: 20px 0;
    }

    .stat-box {
      background: #2a2a2a;
      padding: 15px;
      border-radius: 4px;
      text-align: center;
    }

    .stat-box .label {
      color: #888;
      font-size: 12px;
    }

    .stat-box .value {
      color: #00ff00;
      font-weight: bold;
      font-size: 24px;
    }
  </style>
</head>
<body>

<div class="leaderboard-container">
  <h1>🏆 Base Jump Game Leaderboard</h1>

  <div id="wallet-status" style="margin: 10px 0; padding: 10px; background: #2a2a2a; border-radius: 4px;">
    Not connected
  </div>

  <div class="button-group">
    <button onclick="connectWallet()">Connect Wallet</button>
    <button onclick="refreshLeaderboard()">Refresh Leaderboard</button>
    <button onclick="loadPlayerStats()">My Stats</button>
    <button onclick="location.href='index.html'">Back to Game</button>
  </div>

  <div id="global-stats"></div>

  <div id="player-stats" class="player-stats" style="display: none;">
    <h3>📊 Your Stats</h3>
    <div class="stat-item">
      <div class="stat-label">Rank</div>
      <div class="stat-value" id="player-rank">-</div>
    </div>
    <div class="stat-item">
      <div class="stat-label">Best Score</div>
      <div class="stat-value" id="player-score">-</div>
    </div>
    <div class="stat-item">
      <div class="stat-label">XP</div>
      <div class="stat-value" id="player-xp">-</div>
    </div>
    <div class="stat-item">
      <div class="stat-label">Runs</div>
      <div class="stat-value" id="player-runs">-</div>
    </div>
    <div class="stat-item">
      <div class="stat-label">Jumps</div>
      <div class="stat-value" id="player-jumps">-</div>
    </div>
  </div>

  <h2>🥇 Top Players</h2>
  <table class="leaderboard-table">
    <thead>
      <tr>
        <th style="width: 50px;">Rank</th>
        <th>Player</th>
        <th style="width: 100px;">Score</th>
        <th style="width: 80px;">XP</th>
      </tr>
    </thead>
    <tbody id="leaderboard-body">
      <tr><td colspan="4" style="text-align: center;">Loading...</td></tr>
    </tbody>
  </table>

  <div style="margin-top: 20px; text-align: center; color: #888; font-size: 12px;">
    ⏱️ Last updated: <span id="last-update">-</span>
  </div>
</div>

<script src="leaderboard.js"></script>
<script src="wallet.js"></script>
<script>
  // Initialize on page load
  window.addEventListener('DOMContentLoaded', () => {
    updateWalletStatus();
    refreshLeaderboard();
    loadGlobalStats();
    
    // Auto-refresh every 30 seconds
    setInterval(refreshLeaderboard, 30000);
    setInterval(loadGlobalStats, 30000);
  });

  // Initialize leaderboard client if not already initialized (use global if exists, else create new)
  if (typeof leaderboardClient === 'undefined') {
    window.leaderboardClient = new LeaderboardClient();
  } else {
    window.leaderboardClient = leaderboardClient;
  }

  async function refreshLeaderboard() {
    try {
      const data = await window.leaderboardClient.getLeaderboard(50);
      const tbody = document.getElementById('leaderboard-body');

      if (!data.leaderboard || data.leaderboard.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; color: #888;">No scores yet</td></tr>';
        return;
      }

      tbody.innerHTML = data.leaderboard.map((player, index) => `
        <tr>
          <td class="rank ${index < 3 ? 'top' : ''}">#${player.rank}</td>
          <td>
            <div class="address">${player.address}</div>
            <span style="color: #888; font-size: 12px;">${player.totalRuns} runs</span>
          </td>
          <td style="text-align: right; color: #00ff00; font-weight: bold;">${player.score}</td>
          <td style="text-align: right; color: #ffaa00;">${player.xp}</td>
        </tr>
      `).join('');

      document.getElementById('last-update').innerText = new Date().toLocaleTimeString();
    } catch (error) {
      console.error('Failed to load leaderboard:', error);
      document.getElementById('leaderboard-body').innerHTML = 
        '<tr><td colspan="4" style="text-align: center; color: #ff0000;">Failed to load leaderboard</td></tr>';
    }
  }

  async function loadGlobalStats() {
    try {
      const data = await window.leaderboardClient.getGlobalStats();
      const statsData = data.stats || {};

      document.getElementById('global-stats').innerHTML = `
        <div class="stat-box">
          <div class="label">Total Players</div>
          <div class="value">${statsData.totalPlayers || 0}</div>
        </div>
        <div class="stat-box">
          <div class="label">Total Score</div>
          <div class="value">${(statsData.totalScore || 0).toLocaleString()}</div>
        </div>
        <div class="stat-box">
          <div class="label">Total XP</div>
          <div class="value">${(statsData.totalXP || 0).toLocaleString()}</div>
        </div>
        <div class="stat-box">
          <div class="label">Total Runs</div>
          <div class="value">${(statsData.totalRuns || 0).toLocaleString()}</div>
        </div>
      `;
    } catch (error) {
      console.error('Failed to load stats:', error);
    }
  }

  async function loadPlayerStats() {
    if (!userAddress) {
      alert('Please connect wallet first');
      return;
    }

    try {
      const data = await window.leaderboardClient.getPlayerStats(userAddress);
      const player = data.player;

      document.getElementById('player-rank').innerText = player.rank ? `#${player.rank}` : '-';
      document.getElementById('player-score').innerText = player.score;
      document.getElementById('player-xp').innerText = player.xp;
      document.getElementById('player-runs').innerText = player.totalRuns;
      document.getElementById('player-jumps').innerText = player.totalJumps;

      document.getElementById('player-stats').style.display = 'block';
    } catch (error) {
      console.error('Failed to load player stats:', error);
      alert('Failed to load player stats');
    }
  }
</script>

</body>
</html>
